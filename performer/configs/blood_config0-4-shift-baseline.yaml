## for simualted data
seq_length: 49152
learning_rate: 1e-5
pct_start: 0.3
final_div_factor: 1
train_batch_size: 20
num_individuals_per_gene: 20
#train_batch_size: 24
#num_individuals_per_gene: 24
alpha: 0.5
experiment_name: "baseline_pred_norm_3_tissue"
max_epochs: 20
precision: bf16-mixed
tissues_to_train: "blood,muscle,adipose"
gradient_clip_val: 0.05
seed: 2
mask_dna_prop: 0
discretize_bins: 0
contrast_embed: 0
stratify_expr: 0
residual_expr: 0
predict_expr: 1
raw_expr: 0
gene_embed: 0
atten_pool: 0
attn_dim: 512  # 256, 512
attn_heads: 4 # 2, 4
shift: 100
shift_freq: 1
reverse_complement: 0
rc_freq: 0
train_gene_file: "train_filter_egenes_5K.txt"
val_gene_file: "val_filter_egenes_1K.txt"
test_gene_file: "test_filter_egenes_2K.txt"
expression_filepath: "predicted_gene_expression"
